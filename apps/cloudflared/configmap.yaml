apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared
data:
  config.yml: |
    tunnel: c5e7cc24-7569-424c-8e35-96c587f3ce22
    credentials-file: /etc/cloudflared/credentials/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: auth.mmlinaric.com
        service: https://traefik-tunnel.traefik.svc.cluster.local:8443
        originRequest:
          originServerName: auth.mmlinaric.com
      - hostname: gitlab.mmlinaric.com
        service: https://traefik-tunnel.traefik.svc.cluster.local:8443
        originRequest:
          originServerName: gitlab.mmlinaric.com
          httpHostHeader: gitlab.mmlinaric.com
      - hostname: registry.mmlinaric.com
        service: https://traefik-tunnel.traefik.svc.cluster.local:8443
        originRequest:
          originServerName: registry.mmlinaric.com
          httpHostHeader: registry.mmlinaric.com
      - service: http_status:404

