apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: a5c6104b-5e80-4618-ae88-b4a0011fe6e8
    - secretKey: admin-password
      remoteRef:
        key: 4e261d13-6148-4a34-a15a-b4a0011fff64
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
    template:
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: 6336d9af-f100-4d3e-8e05-b4a00120b414
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram
    creationPolicy: Owner
  data:
    - secretKey: bot-token
      remoteRef:
        key: 3cdbe1d1-2fba-4ea9-841e-b4a001226841
    - secretKey: chat-id
      remoteRef:
        key: 7e8e734a-351d-4627-a32a-b4a001228587
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana
  namespace: monitoring
spec:
  secretName: grafana-tls
  dnsNames: [grafana.mmlinaric.com]
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`grafana.mmlinaric.com`)
      kind: Rule
      services:
        - name: victoria-metrics-pilot-grafana
          port: 80
  tls:
    secretName: grafana-tls
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab
  namespace: monitoring
  labels:
    release: victoria-metrics-pilot
spec:
  groups:
    - name: homelab.endpoints
      rules:
        - alert: PublicEndpointUnavailable
          expr: probe_success == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Endpoint {{ $labels.instance }} is unavailable"
        - alert: CertificateExpiresSoon
          expr: probe_ssl_earliest_cert_expiry - time() < 21 * 24 * 3600
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Certificate for {{ $labels.instance }} expires within 21 days"
    - name: homelab.backups
      rules:
        - alert: VeleroScheduledBackupFailed
          expr: velero_backup_last_status{schedule=~"(gitlab|forgejo|keycloak|dependency-track|jenkins)-(daily|weekly|monthly)"} != 1
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: "Velero backup schedule {{ $labels.schedule }} failed"
        - alert: GitLabLogicalBackupStale
          expr: (time() - velero_backup_last_successful_timestamp{schedule="gitlab-daily"} > 30 * 3600) or absent(velero_backup_last_successful_timestamp{schedule="gitlab-daily"})
          for: 1h
          labels: {severity: critical}
          annotations:
            summary: GitLab has no successful Velero backup in the last 30 hours
        - alert: KeycloakLogicalBackupStale
          expr: >-
            (time() - velero_backup_last_successful_timestamp{schedule="keycloak-daily"} > 30 * 3600)
            or absent(velero_backup_last_successful_timestamp{schedule="keycloak-daily"})
          for: 1h
          labels: {severity: critical}
          annotations:
            summary: Keycloak has no successful encrypted logical backup in the last 30 hours
        - alert: ForgejoConsistentBackupStale
          expr: >-
            (time() - velero_backup_last_successful_timestamp{schedule="forgejo-daily"} > 30 * 3600)
            or absent(velero_backup_last_successful_timestamp{schedule="forgejo-daily"})
          for: 1h
          labels: {severity: critical}
          annotations:
            summary: Forgejo has no successful consistent off-site backup in the last 30 hours
            description: The coordinated Forgejo repository snapshot and PostgreSQL dump are missing or stale.
            impact: Recent repositories and Forgejo metadata may not be recoverable to a matched point.
            action: Check the Forgejo backup coordinator, Velero hooks, and DataUploads.
        - alert: DependencyTrackLogicalBackupStale
          expr: >-
            (time() - velero_backup_last_successful_timestamp{schedule="dependency-track-daily"} > 30 * 3600)
            or absent(velero_backup_last_successful_timestamp{schedule="dependency-track-daily"})
          for: 1h
          labels: {severity: critical}
          annotations:
            summary: Dependency-Track has no successful encrypted logical backup in the last 30 hours
        - alert: JenkinsBackupStale
          expr: >-
            (time() - velero_backup_last_successful_timestamp{schedule="jenkins-daily"} > 30 * 3600)
            or absent(velero_backup_last_successful_timestamp{schedule="jenkins-daily"})
          for: 1h
          labels: {severity: critical}
          annotations:
            summary: Jenkins has no successful off-site backup in the last 30 hours
            description: The daily Velero transfer of the Jenkins thinBackup staging volume is missing or stale.
            impact: Recent Jenkins configuration, jobs, and build history may not be recoverable off site.
            action: Check the latest thinBackup set, Jenkins quiet-mode backup logs, and the jenkins-daily Velero backup.
        - alert: VeleroBackupPartiallyFailed
          expr: >-
            velero_backup_items_errors{schedule=~"(gitlab|forgejo|keycloak|dependency-track|jenkins)-(daily|weekly|monthly)"} > 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Velero backup schedule {{ $labels.schedule }} partially failed"
        - alert: K3sEtcdSnapshotStale
          expr: (max(k3s_etcd_snapshot_created_timestamp{location=~"s3://.*"}) < time() - 14 * 3600) or absent(k3s_etcd_snapshot_created_timestamp{location=~"s3://.*"})
          for: 30m
          labels: {severity: critical}
          annotations:
            summary: K3s has no recent S3 etcd snapshot
        - alert: K3sEtcdSnapshotNotReady
          expr: min(k3s_etcd_snapshot_ready{location=~"s3://.*"}) == 0
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: At least one retained K3s S3 etcd snapshot is not ready
        - alert: GitLabBackupStagingNearlyFull
          expr: >-
            kubelet_volume_stats_used_bytes{namespace="gitlab",persistentvolumeclaim="gitlab-backups"}
            / kubelet_volume_stats_capacity_bytes{namespace="gitlab",persistentvolumeclaim="gitlab-backups"} > 0.8
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: GitLab backup staging volume is more than 80 percent full
        - alert: KeycloakBackupStagingNearlyFull
          expr: >-
            kubelet_volume_stats_used_bytes{namespace="keycloak",persistentvolumeclaim="keycloak-backups"}
            / kubelet_volume_stats_capacity_bytes{namespace="keycloak",persistentvolumeclaim="keycloak-backups"} > 0.8
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: Keycloak backup staging volume is more than 80 percent full
        - alert: ForgejoBackupStagingNearlyFull
          expr: >-
            kubelet_volume_stats_used_bytes{namespace="forgejo",persistentvolumeclaim="forgejo-backups"}
            / kubelet_volume_stats_capacity_bytes{namespace="forgejo",persistentvolumeclaim="forgejo-backups"} > 0.8
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: Forgejo backup staging volume is more than 80 percent full
        - alert: DependencyTrackBackupStagingNearlyFull
          expr: >-
            kubelet_volume_stats_used_bytes{namespace="dependency-track",persistentvolumeclaim="dependency-track-backups"}
            / kubelet_volume_stats_capacity_bytes{namespace="dependency-track",persistentvolumeclaim="dependency-track-backups"} > 0.8
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: Dependency-Track backup staging volume is more than 80 percent full
        - alert: LonghornVolumeUnhealthy
          expr: longhorn_volume_robustness{state=~"degraded|faulted"} == 1
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is {{ $labels.state }}"
    - name: homelab.resource-pressure
      rules:
        - alert: ContainerMemoryNearLimit
          expr: >-
            max by (namespace, pod, container) (
              container_memory_working_set_bytes{container!="", image!=""}
            )
            /
            max by (namespace, pod, container) (
              kube_pod_container_resource_limits{resource="memory", unit="byte"} > 0
            ) > 0.90
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is using more than 90 percent of its memory limit"
        - alert: ContainerMemoryLimitEvents
          expr: >-
            sum by (namespace, pod, container) (
              increase(container_memory_failcnt{container!="", image!=""}[5m])
            ) > 100
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is repeatedly hitting its memory limit"
        - alert: NodeHighIOWait
          expr: avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) > 0.10
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Node {{ $labels.instance }} has spent more than 10 percent of CPU time waiting for I/O"
        - alert: NodeDiskReadLatencyHigh
          expr: >-
            (
              rate(node_disk_read_time_seconds_total{device!~"^(loop|ram|zram|fd|sr).*"}[5m])
              /
              rate(node_disk_reads_completed_total{device!~"^(loop|ram|zram|fd|sr).*"}[5m])
              > 0.05
            )
            and on (instance, device)
            rate(node_disk_reads_completed_total{device!~"^(loop|ram|zram|fd|sr).*"}[5m]) > 20
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Disk {{ $labels.device }} on {{ $labels.instance }} has read latency above 50 milliseconds"
    - name: homelab.logging
      rules:
        - alert: LoggingPipelineUnavailable
          expr: >-
            absent(up{namespace="monitoring", service="loki"})
            or max(up{namespace="monitoring", service="loki"}) == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Loki is unavailable to the monitoring pipeline
        - alert: AlloyDaemonSetUnavailable
          expr: kube_daemonset_status_number_unavailable{namespace="monitoring", daemonset="alloy"} > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Alloy is unavailable on at least one Kubernetes node
        - alert: AlloyDroppingLogs
          expr: sum(increase(loki_write_dropped_entries_total{namespace="monitoring"}[10m])) > 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Alloy is dropping log entries after exhausting retries
        - alert: LokiCanaryMissingEntries
          expr: sum(increase(loki_canary_missing_entries_total{namespace="monitoring"}[10m])) > 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Loki Canary cannot retrieve logs that it submitted
        - alert: LokiStorageNearlyFull
          expr: >-
            kubelet_volume_stats_used_bytes{namespace="monitoring", persistentvolumeclaim="storage-loki-0"}
            / kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim="storage-loki-0"} > 0.8
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: Loki storage is more than 80 percent full
