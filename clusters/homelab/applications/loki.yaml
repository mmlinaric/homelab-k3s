apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.12.1
    helm:
      valuesObject:
        deploymentMode: Monolithic
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            allow_structured_metadata: true
            retention_period: 168h
            volume_enabled: true
          compactor:
            working_directory: /var/loki/compactor
            retention_enabled: true
            delete_request_store: filesystem
          rulerConfig:
            alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
            enable_alertmanager_v2: true
            external_url: https://grafana.mmlinaric.com
            datasource_uid: loki
            evaluation:
              mode: local
            external_labels:
              cluster: homelab
            rule_path: /var/loki/ruler
            storage:
              type: local
              local:
                directory: /etc/loki/rules
        singleBinary:
          replicas: 1
          sidecar: false
          extraVolumes:
            - name: application-alert-rules
              configMap:
                name: loki-application-alert-rules
          extraVolumeMounts:
            - name: application-alert-rules
              mountPath: /etc/loki/rules/fake
              readOnly: true
          persistence:
            enabled: true
            storageClass: longhorn
            size: 10Gi
            whenDeleted: Retain
            whenScaled: Retain
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1, memory: 1Gi}
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        monitoring:
          serviceMonitor:
            enabled: true
            interval: 60s
          rules:
            enabled: true
            labels:
              release: kube-prometheus-stack
          alerts:
            enabled: true
            disabled:
              LokiCompactorHasNotSuccessfullyRunCompaction: true
            labels:
              release: kube-prometheus-stack
        serviceAccount:
          automountServiceAccountToken: false
        extraObjects:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: loki-application-alert-rules
              namespace: monitoring
            data:
              application-alerts.yaml: |
                groups:
                  - name: homelab.application-logs
                    interval: 1m
                    rules:
                      - alert: GitLabLogErrorBurst
                        expr: |
                          (
                            sum(count_over_time({cluster="homelab", namespace="gitlab"} |~ `(?i)\b(error|fatal|panic)\b` [5m]))
                            or on() vector(0)
                          ) > 20
                        for: 10m
                        labels:
                          severity: warning
                          category: logs
                          application: gitlab
                        annotations:
                          summary: GitLab is producing an elevated number of error logs
                          description: More than 20 error, fatal, or panic log lines were observed in five minutes.
                          logs_query: '{cluster="homelab", namespace="gitlab"}'
                      - alert: KeycloakLogErrorBurst
                        expr: |
                          (
                            sum(count_over_time({cluster="homelab", namespace="keycloak"} |~ `(?i)\b(error|fatal|panic)\b` [5m]))
                            or on() vector(0)
                          ) > 10
                        for: 10m
                        labels:
                          severity: warning
                          category: logs
                          application: keycloak
                        annotations:
                          summary: Keycloak is producing an elevated number of error logs
                          description: More than 10 error, fatal, or panic log lines were observed in five minutes.
                          logs_query: '{cluster="homelab", namespace="keycloak"}'
                      - alert: ForgejoLogErrorBurst
                        expr: |
                          (
                            sum(count_over_time({cluster="homelab", namespace="forgejo"} |~ `(?i)\b(error|fatal|panic)\b` [5m]))
                            or on() vector(0)
                          ) > 10
                        for: 10m
                        labels:
                          severity: warning
                          category: logs
                          application: forgejo
                        annotations:
                          summary: Forgejo is producing an elevated number of error logs
                          description: More than 10 error, fatal, or panic log lines were observed in five minutes.
                          logs_query: '{cluster="homelab", namespace="forgejo"}'
                      - alert: ApplicationFatalLogEvent
                        expr: |
                          (
                            sum by (namespace, pod, container) (
                              count_over_time({cluster="homelab", namespace=~"gitlab|forgejo|keycloak"} |~ `(?i)\b(fatal|panic|out of memory)\b` [5m])
                            )
                            or on() vector(0)
                          ) > 0
                        for: 1m
                        labels:
                          severity: warning
                          category: logs
                          notification_type: event
                        annotations:
                          summary: Fatal application log detected
                          description: 'Fatal, panic, or out-of-memory log matches in the last 5 minutes: {{`{{`}} printf "%.0f" $value {{`}}`}}.'
                          impact: The application process may have crashed or become unavailable.
                          action: Review surrounding logs to identify the first error preceding the fatal message.
                          logs_query: >-
                            {cluster="homelab", namespace="{{`{{`}} $labels.namespace {{`}}`}}",
                            pod="{{`{{`}} $labels.pod {{`}}`}}", container="{{`{{`}} $labels.container {{`}}`}}"}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
