apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: 5.9.54
    helm:
      valuesObject:
        controller:
          image:
            tag: 2.568.2-jdk21
            pullPolicy: IfNotPresent
          numExecutors: 0
          executorMode: EXCLUSIVE
          jenkinsUrl: https://jenkins.mmlinaric.com
          agentListenerEnabled: false
          disableRememberMe: true
          javaOpts: -Duser.timezone=Europe/Warsaw
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: 2, memory: 4Gi}
          initContainerResources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 2, memory: 2Gi}
          podSecurityContextOverride:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          containerSecurityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          installPlugins:
            - ssh-slaves:3.1097.v868116049892
            - workflow-aggregator:608.v67378e9d3db_1
            - pipeline-graph-view:998.vc30deece0e36
            - git:5.10.1
            - gitlab-branch-source:743.ve0c8154a_8da_b_
            - git-forensics:4.2463.vf6fecb_444a_b_3
            - docker-workflow:647.vf474049b_b_303
            - junit:1418.v67a_81935603c
            - coverage:3.3325.v2f3dd167a_b_e5
            - warnings-ng:13.10212.v247e4d8d9430
            - credentials-binding:728.v902a_273b_8947
            - configuration-as-code:2117.vc05a_0b_e6b_f4e
            - oic-auth:4.718.ve731df6ca_88a_
            - matrix-auth:3.3
            - prometheus:856.vc9e3d6e4b_b_9e
            - thinBackup:2.1.4
          installLatestPlugins: true
          installLatestSpecifiedPlugins: false
          overwritePlugins: true
          overwritePluginsFromImage: true
          additionalExistingSecrets:
            - name: jenkins-runtime
              keyName: oidc-client-secret
            - name: jenkins-runtime
              keyName: escape-hatch-username
            - name: jenkins-runtime
              keyName: escape-hatch-password
            - name: jenkins-runtime
              keyName: docker-agent-ssh-private-key
          admin:
            createSecret: false
          JCasC:
            # The chart's default configuration always creates a Kubernetes cloud.
            # Jenkins no longer installs the Kubernetes plugin, so provide the
            # required controller configuration explicitly instead.
            defaultConfig: false
            overwriteConfiguration: true
            configScripts:
              controller: |-
                jenkins:
                  authorizationStrategy:
                    loggedInUsersCanDoAnything:
                      allowAnonymousRead: false
                  securityRealm:
                    oic:
                      clientId: jenkins
                      clientSecret: "${jenkins-runtime-oidc-client-secret}"
                      userIdStrategy: caseSensitive
                      groupIdStrategy: caseSensitive
                      serverConfiguration:
                        wellKnown:
                          wellKnownOpenIDConfigurationUrl: https://auth.mmlinaric.com/realms/homelab/.well-known/openid-configuration
                          scopesOverride: openid profile email
                      userNameField: preferred_username
                      fullNameFieldName: name
                      emailFieldName: email
                      groupsFieldName: jenkins_roles
                      logoutFromOpenidProvider: true
                      postLogoutRedirectUrl: https://jenkins.mmlinaric.com/
                      allowTokenAccessWithoutOicSession: true
                      tokenFieldToCheckKey: "contains(jenkins_roles, 'admin')"
                      tokenFieldToCheckValue: "true"
                      properties:
                        - pkce
                        - escapeHatch:
                            username: "${jenkins-runtime-escape-hatch-username}"
                            secret: "${jenkins-runtime-escape-hatch-password}"
                            group: admin
                  disableRememberMe: true
                  mode: EXCLUSIVE
                  numExecutors: 0
                unclassified:
                  location:
                    url: https://jenkins.mmlinaric.com
              docker-agent-node: |-
                jenkins:
                  nodes:
                    - permanent:
                        name: docker-agent
                        labelString: docker-agent
                        mode: EXCLUSIVE
                        numExecutors: 1
                        remoteFS: /var/lib/jenkins-agent
                        launcher:
                          SSH:
                            host: 192.168.60.104
                            port: 22
                            credentialsId: jenkins-docker-agent-ssh
                            javaPath: /usr/bin/java
                            launchTimeoutSeconds: 60
                            maxNumRetries: 10
                            retryWaitTime: 15
                            sshHostKeyVerificationStrategy:
                              manuallyTrustedKeyVerificationStrategy:
                                requireInitialManualTrust: true
              security-settings: |-
                security:
                  contentSecurityPolicy:
                    enforce: true
              thin-backup: |-
                unclassified:
                  resourceRoot:
                    url: https://jenkins-resources.mmlinaric.com/
                  thinBackup:
                    backupAdditionalFiles: false
                    backupBuildArchive: false
                    backupBuildResults: true
                    backupBuildsToKeepOnly: false
                    backupConfigHistory: false
                    backupNextBuildNumber: true
                    backupPath: /var/jenkins_backups
                    backupPluginArchives: false
                    backupUserContents: false
                    cleanupDiff: true
                    diffBackupSchedule: ""
                    excludedFilesRegex: ""
                    failFast: true
                    forceQuietModeTimeout: 120
                    fullBackupSchedule: "0 23 * * *"
                    moveOldBackupsToZipFile: true
                    nrMaxStoredFull: 7
                    waitForIdle: true
          sidecars:
            configAutoReload:
              enabled: false
          prometheus:
            enabled: true
            serviceMonitorAdditionalLabels:
              release: kube-prometheus-stack
            scrapeInterval: 60s
            scrapeEndpoint: /prometheus/
          testEnabled: false
        agent:
          enabled: false
        persistence:
          enabled: true
          storageClass: longhorn
          accessMode: ReadWriteOnce
          size: 20Gi
          labels:
            backup.homelab/strategy: velero
          annotations:
            argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
          volumes:
            - name: jenkins-backups
              persistentVolumeClaim:
                claimName: jenkins-backups
          mounts:
            - name: jenkins-backups
              mountPath: /var/jenkins_backups
        rbac:
          create: true
          readSecrets: false
        serviceAccount:
          create: true
          name: jenkins-controller
          automountServiceAccountToken: true
        serviceAccountAgent:
          create: false
          name: jenkins-agent
          automountServiceAccountToken: false
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, PruneLast=true]
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
