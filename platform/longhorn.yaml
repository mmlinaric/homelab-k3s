apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
spec:
  cron: "30 3 * * *"
  task: snapshot
  groups: [default]
  retain: 3
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-snapshot-cleanup
  namespace: longhorn-system
spec:
  cron: "30 4 * * 0"
  task: snapshot-cleanup
  groups: [default]
  retain: 0
  concurrency: 1
