apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: longhorn-velero
  labels:
    velero.io/csi-volumesnapshot-class: "true"
driver: driver.longhorn.io
deletionPolicy: Delete
parameters:
  type: snap
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: gitlab-daily
  namespace: velero
spec:
  schedule: "0 3 * * *"
  template:
    includedNamespaces:
      - gitlab
    excludedResources:
      - secrets
    storageLocation: default
    snapshotVolumes: true
    snapshotMoveData: true
    itemOperationTimeout: 4h
    ttl: 336h
    hooks:
      resources:
        - name: gitlab-native-backup
          includedNamespaces:
            - gitlab
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gitlab
          pre:
            - exec:
                container: gitlab
                command:
                  - /bin/sh
                  - -ec
                  - |
                    mkdir -p /var/opt/gitlab/backups/config
                    gitlab-backup create CRON=1
                    gitlab-ctl backup-etc --backup-path /var/opt/gitlab/backups/config
                    find /var/opt/gitlab/backups/config -maxdepth 1 -type f -mtime +3 -delete
                onError: Fail
                timeout: 2h
---
