apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
spec:
  cron: "30 3 * * *"
  task: snapshot
  groups: [default]
  retain: 3
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-snapshot-cleanup
  namespace: longhorn-system
spec:
  cron: "30 4 * * 0"
  task: snapshot-cleanup
  groups: [default]
  retain: 0
  concurrency: 1
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  secretName: longhorn-tls
  dnsNames: [longhorn.mmlinaric.com]
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-lan
  namespace: longhorn-system
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`longhorn.mmlinaric.com`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
  tls:
    secretName: longhorn-tls
