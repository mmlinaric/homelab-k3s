apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jenkins
  namespace: jenkins
spec:
  secretName: jenkins-tls
  dnsNames: [jenkins.mmlinaric.com]
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jenkins-lan
  namespace: jenkins
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`jenkins.mmlinaric.com`)
      kind: Rule
      services:
        - {name: jenkins, port: 8080}
  tls:
    secretName: jenkins-tls
