apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildkit
  namespace: ci-build
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: buildkit
  namespace: ci-build
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: buildkit
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkit
  namespace: ci-build
spec:
  replicas: 1
  serviceName: buildkit
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkit
    spec:
      automountServiceAccountToken: false
      serviceAccountName: buildkit
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.30.0-rootless
          imagePullPolicy: IfNotPresent
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
          env:
            - name: BUILDKIT_HOST
              value: tcp://127.0.0.1:1234
          ports:
            - name: buildkit
              containerPort: 1234
          readinessProbe:
            exec:
              command: [buildctl, debug, workers]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [buildctl, debug, workers]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            appArmorProfile: {type: Unconfined}
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: Unconfined}
          volumeMounts:
            - name: buildkit-data
              mountPath: /home/user/.local/share/buildkit
  volumeClaimTemplates:
    - metadata:
        name: buildkit-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
