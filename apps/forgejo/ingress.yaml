apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forgejo
  namespace: forgejo
spec:
  secretName: forgejo-tls
  dnsNames: [git.mmlinaric.com]
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forgejo-login-rate-limit
  namespace: forgejo
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 20
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forgejo-security-headers
  namespace: forgejo
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    frameDeny: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: camera=(), geolocation=(), microphone=(), payment=(), usb=()
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-lan
  namespace: forgejo
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`git.mmlinaric.com`) && !Path(`/metrics`) && !PathPrefix(`/debug/pprof`)
      kind: Rule
      middlewares:
        - name: forgejo-security-headers
      services:
        - {name: forgejo-http, port: 3000}
  tls:
    secretName: forgejo-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-public
  namespace: forgejo
spec:
  entryPoints: [tunnel]
  routes:
    - match: Host(`git.mmlinaric.com`) && Path(`/user/login`)
      kind: Rule
      priority: 20
      middlewares:
        - name: forgejo-login-rate-limit
        - name: forgejo-security-headers
      services:
        - {name: forgejo-http, port: 3000}
    - match: Host(`git.mmlinaric.com`) && !PathPrefix(`/admin`) && !PathPrefix(`/api/v1/admin`) && !Path(`/metrics`) && !PathPrefix(`/debug/pprof`)
      kind: Rule
      priority: 10
      middlewares:
        - name: forgejo-security-headers
      services:
        - {name: forgejo-http, port: 3000}
  tls:
    secretName: forgejo-tls

