apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.2.0
    helm:
      valuesObject:
        deployment:
          replicas: 1
        ingressClass:
          enabled: true
          isDefaultClass: true
        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: false
          kubernetesIngress:
            enabled: true
        ports:
          web:
            port: 8000
            exposedPort: 80
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            port: 8443
            exposedPort: 443
            http:
              tls:
                enabled: true
          tunnel:
            port: 9443
            expose:
              default: false
            http:
              tls:
                enabled: true
        service:
          spec:
            loadBalancerIP: 192.168.70.100
            externalTrafficPolicy: Local
          annotations:
            metallb.io/loadBalancerIPs: 192.168.70.100
        log:
          level: INFO
          format: json
        accessLog:
          enabled: true
          format: json
        metrics:
          prometheus:
            service:
              enabled: true
            serviceMonitor:
              enabled: true
        additionalArguments:
          - --api.dashboard=false
          - --serversTransport.insecureSkipVerify=false
          - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=600s
          - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=600s
          - --entryPoints.tunnel.transport.respondingTimeouts.readTimeout=600s
          - --entryPoints.tunnel.transport.respondingTimeouts.idleTimeout=600s
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 1, memory: 512Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
