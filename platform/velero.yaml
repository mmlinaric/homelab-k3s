  schedule: "30 2 * * *"
  template:
    includedNamespaces:
      - keycloak
    includedResources:
      - deployments
      - pods
      - persistentvolumeclaims
    excludedResources:
      - secrets
    labelSelector:
      matchLabels:
        backup.homelab/strategy: velero
    storageLocation: default
    snapshotVolumes: true
    snapshotMoveData: true
    itemOperationTimeout: 4h
    ttl: 336h
    hooks:
      resources:
        - name: keycloak-logical-backup
          includedNamespaces:
            - keycloak
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-logical-backup
          pre:
            - exec:
                container: postgres-client
                command:
                  - /bin/sh
                  - /scripts/backup.sh
                onError: Fail
                timeout: 1h
