apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dependency-track-db
  namespace: dependency-track
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-standard-trixie
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: dependency-track
      owner: dependency-track
      encoding: UTF8
      localeCType: C.UTF-8
      localeCollate: C.UTF-8
  storage:
    storageClass: longhorn
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  monitoring:
    enablePodMonitor: true
