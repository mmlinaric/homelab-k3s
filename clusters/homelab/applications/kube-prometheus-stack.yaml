apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.2.0
    helm:
      valuesObject:
        crds:
          enabled: true
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: [namespace, alertname]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 6h
              receiver: telegram
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: telegram
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                    chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
                    send_resolved: true
              - name: "null"
          alertmanagerSpec:
            retention: 120h
            secrets: [alertmanager-telegram]
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests: {storage: 2Gi}
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 300m, memory: 384Mi}
        grafana:
          envFromSecret: grafana-oidc
          grafana.ini:
            server:
              root_url: https://grafana.mmlinaric.com
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              allow_sign_up: true
              client_id: grafana
              scopes: openid profile email
              auth_url: https://auth.mmlinaric.com/realms/homelab/protocol/openid-connect/auth
              token_url: https://auth.mmlinaric.com/realms/homelab/protocol/openid-connect/token
              api_url: https://auth.mmlinaric.com/realms/homelab/protocol/openid-connect/userinfo
              role_attribute_path: contains(resource_access.grafana.roles[*], 'admin') && 'Admin' || 'Viewer'
              allow_assign_grafana_admin: true
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            storageClassName: longhorn
            size: 5Gi
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
        prometheus:
          prometheusSpec:
            retention: 7d
            retentionSize: 9GB
            scrapeInterval: 60s
            evaluationInterval: 60s
            serviceDiscoveryRole: EndpointSlice
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests: {storage: 10Gi}
            resources:
              requests: {cpu: 250m, memory: 768Mi}
              limits: {cpu: 2, memory: 2Gi}
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        prometheusOperator:
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
        kubeProxy:
          enabled: true
          endpoints:
            - 192.168.70.10
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        defaultRules:
          rules:
            etcd: false
            kubeControllerManager: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
        kube-state-metrics:
          rbac:
            extraRules:
              - apiGroups: [k3s.cattle.io]
                resources: [etcdsnapshotfiles]
                verbs: [list, watch]
          customResourceState:
            enabled: true
            config:
              kind: CustomResourceStateMetrics
              spec:
                resources:
                  - groupVersionKind:
                      group: k3s.cattle.io
                      version: v1
                      kind: ETCDSnapshotFile
                    metricNamePrefix: k3s
                    labelsFromPath:
                      name: [metadata, name]
                      location: [spec, location]
                    metrics:
                      - name: etcd_snapshot_created_timestamp
                        help: Unix timestamp when the K3s etcd snapshot was created.
                        each:
                          type: Gauge
                          gauge:
                            path: [status, creationTime]
                      - name: etcd_snapshot_ready
                        help: Whether the K3s etcd snapshot is ready for restore.
                        each:
                          type: Gauge
                          gauge:
                            path: [status, readyToUse]
                      - name: etcd_snapshot_size_bytes
                        help: Size of the K3s etcd snapshot in bytes.
                        each:
                          type: Gauge
                          gauge:
                            path: [status, size]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
