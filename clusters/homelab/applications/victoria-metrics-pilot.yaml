apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-pilot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.91.2
    helm:
      valuesObject:
        argocdReleaseOverride: victoria-metrics-pilot

        # Transitional operator-only release. It finalizes the old CRs and
        # reconciles the clean-name release until operator ownership moves.
        victoria-metrics-operator:
          admissionWebhooks:
            certManager:
              enabled: true
          operator:
            disable_prometheus_converter: false
            prometheus_converter_add_argocd_ignore_annotations: true
            enable_converter_ownership: true
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}

        vmsingle: {enabled: false}
        vmagent: {enabled: false}
        vmalert: {enabled: false}
        alertmanager: {enabled: false}
        grafana: {enabled: false, forceDeployDatasource: false}
        prometheus-node-exporter: {enabled: false}
        kube-state-metrics: {enabled: false}
        kubelet: {enabled: false}
        kubeApiServer: {enabled: false}
        kubeControllerManager: {enabled: false}
        kubeDns: {enabled: false}
        coreDns: {enabled: false}
        kubeEtcd: {enabled: false}
        kubeScheduler: {enabled: false}
        kubeProxy: {enabled: false}
        defaultDashboards: {enabled: false}
        defaultRules: {enabled: false}
        syncJob: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
