apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitlab-ingress
  namespace: gitlab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {protocol: TCP, port: 80}
