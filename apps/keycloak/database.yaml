apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-standard-trixie
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true
  superuserSecret:
    name: keycloak-superuser
  managed:
    roles:
      - name: keycloak
        ensure: present
        login: true
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: keycloak-database
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-database
      encoding: UTF8
      localeCType: C.UTF-8
      localeCollate: C.UTF-8
  storage:
    storageClass: longhorn
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
