apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dependency-track-backups
  namespace: dependency-track
  labels:
    backup.homelab/strategy: velero
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dependency-track-logical-backup
  namespace: dependency-track
data:
  backup.sh: |
    #!/bin/sh
    set -eu

    timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
    archive="/backups/dependency-track-${timestamp}.dump"
    temporary="${archive}.tmp"

    cleanup() {
      rm -f "${temporary}"
    }
    trap cleanup EXIT HUP INT TERM

    pg_dump \
      --format=custom \
      --compress=gzip:6 \
      --no-owner \
      --no-acl \
      --file="${temporary}"
    pg_restore --list "${temporary}" >/dev/null
    mv "${temporary}" "${archive}"
    (
      cd /backups
      sha256sum "$(basename "${archive}")" > "$(basename "${archive}").sha256"
    )

    find /backups -maxdepth 1 -type f \
      \( -name 'dependency-track-*.dump' -o -name 'dependency-track-*.dump.sha256' \) \
      -mtime +3 -delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-logical-backup
  namespace: dependency-track
  labels:
    app.kubernetes.io/name: dependency-track-logical-backup
    backup.homelab/strategy: velero
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dependency-track-logical-backup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dependency-track-logical-backup
        backup.homelab/strategy: velero
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres-client
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
          command: [sh, -c, "trap 'exit 0' TERM INT; sleep infinity & wait"]
          env:
            - name: PGHOST
              value: dependency-track-db-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: dependency-track
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: dependency-track-db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: dependency-track-db-app
                  key: password
            - name: PGCONNECT_TIMEOUT
              value: "10"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: backups, mountPath: /backups}
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: dependency-track-backups
        - name: scripts
          configMap:
            name: dependency-track-logical-backup
            defaultMode: 365
        - name: tmp
          emptyDir: {}
