apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-pilot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.91.2
    helm:
      valuesObject:
        argocdReleaseOverride: victoria-metrics-pilot

        victoria-metrics-operator:
          admissionWebhooks:
            certManager:
              enabled: true
          operator:
            disable_prometheus_converter: false
            prometheus_converter_add_argocd_ignore_annotations: true
            enable_converter_ownership: true
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}

        vmsingle:
          enabled: true
          spec:
            retentionPeriod: 7d
            extraArgs:
              storage.minFreeDiskSpaceBytes: 1GB
            storage:
              storageClassName: longhorn
              accessModes: [ReadWriteOnce]
              resources:
                requests: {storage: 10Gi}
            resources:
              requests: {cpu: 150m, memory: 500Mi}
              limits: {cpu: 1200m, memory: 1500Mi}

        vmagent:
          enabled: true
          rbac:
            namespaced: false
          spec:
            selectAllByDefault: true
            scrapeInterval: 60s
            scrapeTimeout: 10s
            resources:
              requests: {cpu: 50m, memory: 200Mi}
              limits: {cpu: 200m, memory: 500Mi}

        vmalert:
          enabled: true
          spec:
            selectAllByDefault: true
            evaluationInterval: 60s
            resources:
              requests: {cpu: 50m, memory: 200Mi}
              limits: {cpu: 200m, memory: 500Mi}

        alertmanager:
          enabled: true
          # The operator prefixes managed resources with "vmalertmanager-".
          # Keep the CR name short enough for the resulting Service DNS name.
          name: vm-alertmanager
          templateFiles:
            telegram.tmpl: |-
              {{- define "telegram.homelab.message" -}}
              {{ if eq .CommonLabels.notification_type "event" }}🟠 <b>EVENT -
              {{- else }}
              {{- if eq .Status "firing" }}
              {{- if eq .CommonLabels.severity "critical" }}🔴
              {{- else if eq .CommonLabels.severity "warning" }}🟠
              {{- else }}ℹ️{{ end }}
              {{- else }}🟢{{ end }} <b>{{ .Status | toUpper | html }} -
              {{- end }}
              {{- if .CommonAnnotations.summary }} {{ .CommonAnnotations.summary | html }}
              {{- else }} {{ .CommonLabels.alertname | html }}{{ end }}</b>

              {{ if .CommonLabels.severity }}Severity: {{ .CommonLabels.severity | toUpper | html }}{{ end }}
              {{ range .Alerts }}{{ if or .Labels.cluster .Labels.namespace }}<b>Where:</b>
              {{- with .Labels.cluster }} {{ . | html }}{{ end }}
              {{- if and .Labels.cluster .Labels.namespace }} / {{ end }}
              {{- with .Labels.namespace }}{{ . | html }}{{ end }}
              {{- end }}{{ if or .Labels.pod .Labels.container }}
              <b>Workload:</b>{{ with .Labels.pod }} {{ . | html }}{{ end }}
              {{- if and .Labels.pod .Labels.container }} / {{ end }}
              {{- with .Labels.container }}{{ . | html }}{{ end }}{{ end }}

              <b>What:</b>
              {{ if eq .Status "firing" }}
              {{- if .Annotations.description }}{{ .Annotations.description | html }}
              {{- else }}The alert condition is active.{{ end }}
              {{- else }}
              {{- if .Annotations.resolved_description }}{{ .Annotations.resolved_description | html }}
              {{- else }}The alert condition is no longer active.{{ end }}
              {{- end }}{{ if and (eq .Status "firing") .Annotations.impact }}

              <b>Possible impact:</b>
              {{ .Annotations.impact | html }}{{ end }}{{ if and (eq .Status "firing") .Annotations.action }}

              <b>Next step:</b>
              {{ .Annotations.action | html }}{{ end }}
              {{- if or .Annotations.logs_query .GeneratorURL .Annotations.runbook_url }}

              {{ if .Annotations.logs_query }}
              {{- $pane := printf `{"alert":{"datasource":"loki","queries":[{"refId":"A","expr":%q,` .Annotations.logs_query }}
              {{- $pane = printf `%s"queryType":"range","datasource":{"type":"loki","uid":"loki"}}],` $pane }}
              {{- $pane = printf `%s"range":{"from":"now-1h","to":"now"}}}` $pane }}
              🔎 <a href="https://grafana.mmlinaric.com/explore?panes={{ $pane | urlquery }}&amp;schemaVersion=1&amp;orgId=1">Open affected logs</a>
              {{- else if .GeneratorURL }}🔎 <a href="{{ .GeneratorURL | html }}">Open alert source</a>{{ end }}
              {{- if .Annotations.runbook_url }}
              📖 <a href="{{ .Annotations.runbook_url | html }}">Open runbook</a>{{ end }}{{ end }}
              {{ end }}
              {{- end -}}
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: [namespace, alertname, task]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 6h
              receiver: telegram
              routes:
                - receiver: "null"
                  matchers:
                    - alertname =~ "Watchdog|InfoInhibitor"
                - receiver: telegram-events
                  matchers:
                    - notification_type = "event"
            receivers:
              - name: telegram
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                    chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
                    send_resolved: true
                    parse_mode: HTML
                    message: '{{ template "telegram.homelab.message" . }}'
              - name: telegram-events
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                    chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
                    send_resolved: false
                    parse_mode: HTML
                    message: '{{ template "telegram.homelab.message" . }}'
              - name: "null"
          spec:
            retention: 120h
            secrets: [alertmanager-telegram]
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests: {storage: 2Gi}
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 300m, memory: 384Mi}
        grafana:
          enabled: true
          envFromSecret: grafana-oidc
          grafana.ini:
            server:
              root_url: https://grafana.mmlinaric.com
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              allow_sign_up: true
              client_id: grafana
              scopes: openid profile email
              auth_url: https://auth.mmlinaric.com/realms/homelab/protocol/openid-connect/auth
              token_url: https://auth.mmlinaric.com/realms/homelab/protocol/openid-connect/token
              api_url: https://auth.mmlinaric.com/realms/homelab/protocol/openid-connect/userinfo
              role_attribute_path: contains(resource_access.grafana.roles[*], 'admin') && 'Admin' || 'Viewer'
              allow_assign_grafana_admin: true
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            storageClassName: longhorn
            size: 5Gi
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: 1, memory: 768Mi}
        defaultDatasources:
          victoriametrics:
            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                uid: prometheus
                isDefault: true
                editable: false
                jsonData:
                  prometheusType: Prometheus
                  prometheusVersion: 2.24.0
                  timeInterval: 60s
                  timeout: 60
          alertmanager:
            datasources:
              - name: Alertmanager
                uid: alertmanager
                type: alertmanager
                access: proxy
                isDefault: false
                editable: false
                jsonData:
                  handleGrafanaManagedAlerts: false
                  implementation: prometheus
          extra:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
              editable: false
              jsonData:
                maxLines: 1000
                timeout: 60
        prometheus-node-exporter:
          enabled: false
        kube-state-metrics:
          enabled: false

        # Existing kube-prometheus-stack ServiceMonitors and PodMonitors are
        # converted by the VM operator, so native stack scrapes would duplicate
        # samples and invalidate the comparison.
        kubelet:
          enabled: false
        kubeApiServer:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeDns:
          enabled: false
        coreDns:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false

        defaultDashboards:
          enabled: false
        defaultRules:
          enabled: true
          # Existing PrometheusRules remain the authoritative Kubernetes and
          # application rule source. Fetch only VictoriaMetrics self-health
          # rules here so the cutover does not duplicate existing groups.
          sources:
            etcd:
              enabled: false
            alertmanager:
              enabled: false
            kubernetes-control-plane:
              enabled: false
            kubernetes:
              enabled: false
            kube-state-metrics:
              enabled: false
            node-exporter:
              enabled: false
            vmcluster:
              enabled: false
            vlhealth:
              enabled: false
            vlagent:
              enabled: false
            victorialogs:
              enabled: false
            victoriatraces:
              enabled: false
            vthealth:
              enabled: false
        syncJob:
          enabled: true

        # kube-proxy is exposed through a manually managed EndpointSlice only.
        # The converted ServiceMonitor defaults to legacy Endpoints discovery,
        # so this explicit scrape preserves target parity with Prometheus.
        extraObjects:
          - apiVersion: operator.victoriametrics.com/v1beta1
            kind: VMServiceScrape
            metadata:
              name: kube-proxy-endpointslice
              namespace: monitoring
            spec:
              discoveryRole: endpointslices
              endpoints:
                - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                  port: http-metrics
                  metricRelabelConfigs:
                    - action: drop
                      regex: ^(apiserver|etcd)_.*
                      sourceLabels: [__name__]
              jobLabel: jobLabel
              namespaceSelector:
                matchNames: [kube-system]
              selector:
                matchLabels:
                  app: kube-prometheus-stack-kube-proxy
                  release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
