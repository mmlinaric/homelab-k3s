apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-database
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: keycloak-database
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: 43808b34-e399-4f3e-9739-b4a0011bbf4a
    - secretKey: password
      remoteRef:
        key: b1db98b5-15f7-460b-aac7-b4a0011c13a4
---
