apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: oxisource-public
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":\"mmlinaric\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .token
          (printf "mmlinaric:%s" .token | b64enc) }}
  data:
    - secretKey: token
      remoteRef:
        key: ad890654-cc7b-45f0-927b-b4bb012cb9a9
