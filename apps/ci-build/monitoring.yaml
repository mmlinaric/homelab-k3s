apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: buildkit
  namespace: ci-build
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.buildkit
      rules:
        - alert: BuildKitUnavailable
          expr: >-
            kube_statefulset_status_replicas_ready{namespace="ci-build",statefulset="buildkit"} < 1
            or absent(kube_statefulset_status_replicas_ready{namespace="ci-build",statefulset="buildkit"})
          for: 10m
          labels:
            severity: warning
            application: jenkins
          annotations:
            summary: The Jenkins BuildKit service is unavailable
            description: BuildKit has had no ready replica for at least ten minutes.
            impact: Jenkins container-image stages cannot run.
            action: Check the BuildKit pod, PVC, network policies, and recent Argo CD sync events.
            logs_query: '{cluster="homelab", namespace="ci-build", container="buildkitd"}'
        - alert: BuildKitCacheNearlyFull
          expr: >-
            kubelet_volume_stats_used_bytes{namespace="ci-build",persistentvolumeclaim="buildkit-data-buildkit-0"}
            / kubelet_volume_stats_capacity_bytes{namespace="ci-build",persistentvolumeclaim="buildkit-data-buildkit-0"} > 0.8
          for: 30m
          labels:
            severity: warning
            application: jenkins
          annotations:
            summary: BuildKit cache volume is more than 80 percent full
