apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.45.0
    helm:
      valuesObject:
        fullnameOverride: headlamp
        replicaCount: 1
        config:
          inCluster: true
          inClusterContextName: homelab
          sessionTTL: 28800
          enableHelm: false
          oidc:
            secret:
              create: false
            externalSecret:
              enabled: true
              name: headlamp-oidc
              hasScopes: true
            callbackURL: https://headlamp.mmlinaric.com/oidc-callback
            usePKCE: true
        serviceAccount:
          create: true
          name: headlamp
        clusterRoleBinding:
          create: false
        automountServiceAccountToken: true
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        service:
          type: ClusterIP
          port: 80
        ingress:
          enabled: false
        persistentVolumeClaim:
          enabled: false
        pluginsManager:
          enabled: false
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
