apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-backups
  namespace: forgejo
  labels:
    backup.homelab/strategy: velero
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-backup
  namespace: forgejo
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-backup
  namespace: forgejo
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-backup
  namespace: forgejo
subjects:
  - kind: ServiceAccount
    name: forgejo-backup
    namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-backup
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-backup
  namespace: forgejo
data:
  pre-backup.sh: |
    #!/bin/sh
    set -eu

    marker=/state/backup-in-progress
    timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
    archive="/backups/forgejo-${timestamp}.dump"
    temporary="${archive}.tmp"

    recover() {
      kubectl -n forgejo scale deployment forgejo --replicas=1 >/dev/null || true
      rm -f "${marker}" "${temporary}"
    }
    trap recover EXIT HUP INT TERM

    kubectl -n forgejo scale deployment forgejo --replicas=0
    kubectl -n forgejo wait pod \
      --for=delete \
      --selector=app.kubernetes.io/name=forgejo \
      --timeout=10m
    date +%s > "${marker}"

    dbpod="$(kubectl -n forgejo get pod \
      --selector=cnpg.io/cluster=forgejo-db,role=primary \
      --output=jsonpath='{.items[0].metadata.name}')"
    test -n "${dbpod}"
    kubectl -n forgejo exec "${dbpod}" -c postgres -- \
      pg_dump \
        --format=custom \
        --compress=gzip:6 \
        --no-owner \
        --no-acl \
        --dbname=forgejo > "${temporary}"
    kubectl -n forgejo exec -i "${dbpod}" -c postgres -- \
      pg_restore --list < "${temporary}" >/dev/null
    mv "${temporary}" "${archive}"
    (
      cd /backups
      sha256sum "$(basename "${archive}")" > "$(basename "${archive}").sha256"
    )
    find /backups -maxdepth 1 -type f \
      \( -name 'forgejo-*.dump' -o -name 'forgejo-*.dump.sha256' \) \
      -mtime +3 -delete

    trap - EXIT HUP INT TERM
  post-backup.sh: |
    #!/bin/sh
    set -eu
    kubectl -n forgejo scale deployment forgejo --replicas=1
    rm -f /state/backup-in-progress
  watchdog.sh: |
    #!/bin/sh
    set -eu

    marker=/state/backup-in-progress
    while true; do
      if [ -s "${marker}" ]; then
        started="$(cat "${marker}")"
        now="$(date +%s)"
        if [ "$((now - started))" -gt 1800 ]; then
          echo "Backup exceeded 30 minutes; restoring Forgejo availability." >&2
          kubectl -n forgejo scale deployment forgejo --replicas=1 || true
          rm -f "${marker}"
        fi
      fi
      sleep 30
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-backup
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-backup
    backup.homelab/strategy: velero
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-backup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-backup
        backup.homelab/strategy: velero
    spec:
      serviceAccountName: forgejo-backup
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backup-coordinator
          image: alpine/kubectl:1.36.3
          command: [/bin/sh, /scripts/watchdog.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: backups, mountPath: /backups}
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: state, mountPath: /state}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: forgejo-backups
        - name: scripts
          configMap:
            name: forgejo-backup
            defaultMode: 365
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
