apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-backups
  namespace: jenkins
  labels:
    backup.homelab/strategy: velero
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
