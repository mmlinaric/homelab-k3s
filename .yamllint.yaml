extends: default
rules:
  braces:
    max-spaces-inside: 1
  comments-indentation: false
  line-length:
    max: 180
  octal-values:
    forbid-explicit-octal: true
    forbid-implicit-octal: true
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
  empty-lines:
    max-end: 1
ignore: |
  ansible/templates/
  rendered/
