---
- name: Deploy the sec1 Wazuh central components
  hosts: wazuh_servers
  become: true
  vars:
    wazuh_indexer_passwords:
      admin: "{{ lookup('env', 'WAZUH_INDEXER_ADMIN_PASSWORD') }}"
      anomalyadmin: "{{ lookup('env', 'WAZUH_INDEXER_ANOMALYADMIN_PASSWORD') }}"
      kibanaserver: "{{ lookup('env', 'WAZUH_INDEXER_KIBANASERVER_PASSWORD') }}"
      kibanaro: "{{ lookup('env', 'WAZUH_INDEXER_KIBANARO_PASSWORD') }}"
      logstash: "{{ lookup('env', 'WAZUH_INDEXER_LOGSTASH_PASSWORD') }}"
      readall: "{{ lookup('env', 'WAZUH_INDEXER_READALL_PASSWORD') }}"
      snapshotrestore: "{{ lookup('env', 'WAZUH_INDEXER_SNAPSHOTRESTORE_PASSWORD') }}"
    wazuh_api_passwords:
      wazuh: "{{ lookup('env', 'WAZUH_API_ADMIN_PASSWORD') }}"
      wazuh-wui: "{{ lookup('env', 'WAZUH_API_WUI_PASSWORD') }}"
    wazuh_enrollment_password: "{{ lookup('env', 'WAZUH_ENROLLMENT_PASSWORD') }}"
    wazuh_cloudflare_api_token: "{{ lookup('env', 'WAZUH_CLOUDFLARE_API_TOKEN') }}"
    wazuh_acme_email: "{{ lookup('env', 'WAZUH_ACME_EMAIL') }}"
    wazuh_restic_password: "{{ lookup('env', 'WAZUH_RESTIC_PASSWORD') }}"
    wazuh_s3_access_key: "{{ lookup('env', 'WAZUH_S3_ACCESS_KEY') }}"
    wazuh_s3_secret_key: "{{ lookup('env', 'WAZUH_S3_SECRET_KEY') }}"
    wazuh_s3_endpoint: "{{ lookup('env', 'WAZUH_S3_ENDPOINT') }}"
    wazuh_s3_region: "{{ lookup('env', 'WAZUH_S3_REGION') }}"
    wazuh_telegram_bot_token: "{{ lookup('env', 'WAZUH_TELEGRAM_BOT_TOKEN') }}"
    wazuh_telegram_chat_id: "{{ lookup('env', 'WAZUH_TELEGRAM_CHAT_ID') }}"
  pre_tasks:
    - name: Require policy-compliant Wazuh component passwords
      ansible.builtin.assert:
        that:
          - item is match('^(?=.{8,64}$)(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[.*+?\-])[A-Za-z0-9.*+?\-]+$')
        fail_msg: A Wazuh component password does not meet the installer policy.
      loop: >-
        {{ wazuh_indexer_passwords.values() | list
           + wazuh_api_passwords.values() | list }}
      no_log: true

    - name: Require non-empty external credentials and settings
      ansible.builtin.assert:
        that: item | length > 0
        fail_msg: A required sec1 deployment value is missing.
      loop:
        - "{{ wazuh_enrollment_password }}"
        - "{{ wazuh_cloudflare_api_token }}"
        - "{{ wazuh_acme_email }}"
        - "{{ wazuh_restic_password }}"
        - "{{ wazuh_s3_access_key }}"
        - "{{ wazuh_s3_secret_key }}"
        - "{{ wazuh_s3_endpoint }}"
        - "{{ wazuh_s3_region }}"
        - "{{ wazuh_telegram_bot_token }}"
        - "{{ wazuh_telegram_chat_id }}"
      no_log: true
  roles:
    - ../roles/wazuh_server
    - ../roles/wazuh_malware_endpoint

- name: Enroll the initial Linux and Proxmox agents
  hosts: wazuh_agents
  become: true
  serial: 1
  vars:
    wazuh_enrollment_password: "{{ lookup('env', 'WAZUH_ENROLLMENT_PASSWORD') }}"
  pre_tasks:
    - name: Require the enrollment password
      ansible.builtin.assert:
        that: wazuh_enrollment_password | length >= 8
      no_log: true
  roles:
    - ../roles/wazuh_agent
    - ../roles/wazuh_malware_endpoint

- name: Assign enrolled agents to declarative groups
  hosts: wazuh_servers
  become: true
  vars:
    wazuh_api_admin_password: "{{ lookup('env', 'WAZUH_API_ADMIN_PASSWORD') }}"
  tasks:
    - name: Assign initial agent groups through the local manager API
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/wazuh-assign-agent-group
          - "{{ item }}"
          - "{{ hostvars[item].wazuh_agent_group }}"
      environment:
        WAZUH_API_PASSWORD: "{{ wazuh_api_admin_password }}"
      loop: "{{ groups['wazuh_agents'] }}"
      register: wazuh_group_assignment
      changed_when: "'changed' in wazuh_group_assignment.stdout"
      no_log: true
