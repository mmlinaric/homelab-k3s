apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-backups
  namespace: gitlab
  labels:
    backup.homelab/strategy: velero
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
