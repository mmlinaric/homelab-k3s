apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.6.2
    helm:
      valuesObject:
        # Transitional empty release: one reconciliation prunes every workload
        # before this Application is removed. Prometheus CRDs are retained by
        # the dedicated prometheus-operator-crds Application.
        crds: {enabled: false}
        defaultRules: {create: false}
        alertmanager: {enabled: false}
        grafana: {enabled: false}
        prometheus: {enabled: false}
        prometheusOperator: {enabled: false}
        kubeStateMetrics: {enabled: false}
        nodeExporter: {enabled: false}
        kubernetesServiceMonitors: {enabled: false}
        kubeApiServer: {enabled: false}
        kubelet: {enabled: false}
        kubeControllerManager: {enabled: false}
        coreDns: {enabled: false}
        kubeDns: {enabled: false}
        kubeEtcd: {enabled: false}
        kubeScheduler: {enabled: false}
        kubeProxy: {enabled: false}
        thanosRuler: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
