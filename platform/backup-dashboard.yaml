apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  backup-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "GitLab seconds since successful backup",
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "time() - velero_backup_last_successful_timestamp{schedule=\"gitlab-daily\"}"}],
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 108000}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "stat",
          "title": "Keycloak seconds since logical backup",
          "gridPos": {"h": 8, "w": 6, "x": 6, "y": 0},
          "targets": [{"refId": "A", "expr": "time() - velero_backup_last_successful_timestamp{schedule=\"keycloak-daily\"}"}],
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 108000}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "stat",
          "title": "K3s seconds since S3 etcd snapshot",
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 0},
          "targets": [{"refId": "A", "expr": "time() - max(k3s_etcd_snapshot_created_timestamp{location=~\"s3://.*\"})"}],
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 50400}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "stat",
          "title": "Jenkins seconds since successful backup",
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 0},
          "targets": [{"refId": "A", "expr": "time() - velero_backup_last_successful_timestamp{schedule=\"jenkins-daily\"}"}],
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 108000}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "gauge",
          "title": "GitLab backup staging usage",
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 8},
          "targets": [{
            "refId": "A",
            "expr": "kubelet_volume_stats_used_bytes{persistentvolumeclaim=\"gitlab-backups\"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=\"gitlab-backups\"}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green"}, {"color": "yellow", "value": 0.7}, {"color": "red", "value": 0.8}]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "gauge",
          "title": "Keycloak backup staging usage",
          "gridPos": {"h": 8, "w": 6, "x": 6, "y": 8},
          "targets": [{
            "refId": "A",
            "expr": "kubelet_volume_stats_used_bytes{persistentvolumeclaim=\"keycloak-backups\"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=\"keycloak-backups\"}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green"}, {"color": "yellow", "value": 0.7}, {"color": "red", "value": 0.8}]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "stat",
          "title": "Unhealthy Longhorn volumes",
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 8},
          "targets": [{"refId": "A", "expr": "sum(longhorn_volume_robustness{state=~\"degraded|faulted\"} == 1) or vector(0)"}],
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "table",
          "title": "Velero schedule status",
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 8},
          "targets": [{
            "refId": "A",
            "expr": "velero_backup_last_status{schedule=~\"(gitlab|forgejo|keycloak|dependency-track|jenkins)-(daily|weekly|monthly)\"}",
            "format": "table",
            "instant": true
          }],
          "fieldConfig": {"defaults": {}, "overrides": []},
          "options": {"showHeader": true}
        },
        {
          "type": "gauge",
          "title": "Jenkins backup staging usage",
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 16},
          "targets": [{
            "refId": "A",
            "expr": "kubelet_volume_stats_used_bytes{persistentvolumeclaim=\"jenkins-backups\"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=\"jenkins-backups\"}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green"}, {"color": "yellow", "value": 0.7}, {"color": "red", "value": 0.8}]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "stat",
          "title": "Forgejo seconds since consistent backup",
          "gridPos": {"h": 8, "w": 6, "x": 6, "y": 16},
          "targets": [{"refId": "A", "expr": "time() - velero_backup_last_successful_timestamp{schedule=\"forgejo-daily\"}"}],
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 108000}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "type": "gauge",
          "title": "Forgejo backup staging usage",
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 16},
          "targets": [{
            "refId": "A",
            "expr": "kubelet_volume_stats_used_bytes{persistentvolumeclaim=\"forgejo-backups\"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=\"forgejo-backups\"}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green"}, {"color": "yellow", "value": 0.7}, {"color": "red", "value": 0.8}]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        }
      ],
      "refresh": "1m",
      "schemaVersion": 41,
      "tags": ["homelab", "backup"],
      "templating": {"list": []},
      "time": {"from": "now-7d", "to": "now"},
      "timezone": "browser",
      "title": "Homelab Backup Overview",
      "uid": "homelab-backups",
      "version": 1
    }
